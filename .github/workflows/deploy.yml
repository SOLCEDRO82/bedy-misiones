name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Ensure index.html and SPA routing fallback exist
        run: |
          # Si Nitro generó la salida en .output/public, aseguramos el index y el fallback de rutas
          if [ -d ".output/public" ]; then
            cd .output/public
            if [ ! -f "index.html" ] && [ -f "../../index.html" ]; then
              cp ../../index.html index.html
            fi
            cp index.html 404.html
            touch .nojekyll
            cd -
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.output/public' # o el directorio que use tu estructura

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
