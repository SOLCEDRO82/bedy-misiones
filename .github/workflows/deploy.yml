name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Prepare static files for GitHub Pages
        run: |
          # Verificamos si la salida está en .output/public o en dist
          if [ -d ".output/public" ]; then
            TARGET_DIR=".output/public"
          elif [ -d "dist" ]; then
            TARGET_DIR="dist"
          else
            TARGET_DIR="public"
          fi
          
          # Aseguramos el archivo .nojekyll y el fallback 404 para la SPA
          touch "$TARGET_DIR/.nojekyll"
          if [ -f "$TARGET_DIR/index.html" ]; then
            cp "$TARGET_DIR/index.html" "$TARGET_DIR/404.html"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.output/public' # o el directorio que use tu estructura

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
