name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Generate static HTML index for GitHub Pages
        run: |
          JS_FILE=$(basename $(ls .output/public/assets/index-*.js | head -n 1))
          CSS_FILE=$(basename $(ls .output/public/assets/styles-*.css | head -n 1))
          
          cat <<EOF > .output/public/index.html
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Bedy Misiones</title>
            <link rel="stylesheet" href="/bedy-misiones/assets/$CSS_FILE" />
          </head>
          <body>
            <div id="root"></div>
            <script type="module" src="/bedy-misiones/assets/$JS_FILE"></script>
          </body>
          </html>
          EOF

          cp .output/public/index.html .output/public/404.html
          touch .output/public/.nojekyll
          
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.output/public' # o el directorio que use tu estructura

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
