name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Prerender static HTML for SPA
        run: |
          # Inicia la app compilada en segundo plano
          bun run start &
          SERVER_PID=$!
          
          # Espera a que el servidor esté activo
          timeout 30 bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 1; done'
          
          # Descarga el HTML renderizado para la raíz y fallback de rutas
          curl -s http://localhost:3000/bedy-misiones/ > .output/public/index.html
          cp .output/public/index.html .output/public/404.html
          touch .output/public/.nojekyll
          
          # Detiene el servidor temporal
          kill $SERVER_PID || true
          
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.output/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
